name: Finetune Adam 1.1B with 4-bit QLoRA


on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Maximum training epochs; 3 is the conservative default'
        required: false
        default: '3'
        type: string
      runner_label:
        description: 'GPU runner label; use a configured self-hosted GPU runner or ubuntu-latest for a preflight failure'
        required: false
        default: 'ubuntu-latest'
        type: string

jobs:
  finetune:
    # Use a larger runner with GPU support (requires Team/Enterprise or paid runner minutes)
    # Adjust runner label based on your organization's configured GPU runner (e.g., ubuntu-22.04-16core or custom GPU runner)
    runs-on: ${{ inputs.runner_label }}

    steps:
      - name: Checkout repository (v3 branch)
        uses: actions/checkout@v4
        with:
          ref: v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Verify CUDA GPU
        run: |
          command -v nvidia-smi >/dev/null || { echo 'No NVIDIA GPU runner detected. Configure a GPU runner and rerun.'; exit 1; }
          nvidia-smi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
          pip install "transformers>=4.45" "datasets>=2.20" "accelerate>=1.1" peft bitsandbytes pandas pyarrow sentencepiece safetensors

      - name: Generate Dataset
        run: |
          python3 create_dataset.py

      - name: Run Finetuning
        env:
          EPOCHS: ${{ inputs.epochs }}
          OUTPUT_DIR: ./adam-tinyllama-qlora
        run: |
          python3 finetune_paradox.py

      - name: Archive Checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: adam-tinyllama-qlora-reviewed
          path: ./adam-tinyllama-qlora/
