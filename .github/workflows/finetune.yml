name: Finetune Adam 1.1B with Full-Precision LoRA


on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Maximum training epochs; 3 is the conservative default'
        required: false
        default: '3'
        type: string
      runner_label:
        description: 'Runner label for a CPU runner'
        required: false
        default: 'ubuntu-latest'
        type: string

jobs:
  finetune:
    # CPU-only training; choose a runner with sufficient RAM and CPU cores.
    runs-on: ${{ inputs.runner_label }}

    steps:
      - name: Checkout repository (v3 branch)
        uses: actions/checkout@v4
        with:
          ref: v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.45" "datasets>=2.20" "accelerate>=1.1" peft pandas pyarrow sentencepiece safetensors

      - name: Generate Dataset
        run: |
          python3 create_dataset.py

      - name: Configure CPU threads
        run: echo "CPU_THREADS=$(nproc)" >> "$GITHUB_ENV"

      - name: Run CPU-only Finetuning
        env:
          EPOCHS: ${{ inputs.epochs }}
          OUTPUT_DIR: ./adam-tinyllama-qlora
        run: |
          python3 finetune_paradox.py

      - name: Archive Checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: adam-tinyllama-qlora-reviewed
          path: ./adam-tinyllama-qlora/
