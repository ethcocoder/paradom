name: Finetune Open Llama 3B (Adam Persona)

on:
  workflow_dispatch:
    inputs:
      num_steps:
        description: 'Number of training steps'
        required: false
        default: '2100'
        type: string

jobs:
  finetune:
    # Use a larger runner with GPU support (requires Team/Enterprise or paid runner minutes)
    # Adjust runner label based on your organization's configured GPU runner (e.g., ubuntu-22.04-16core or custom GPU runner)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository (v3 branch)
        uses: actions/checkout@v4
        with:
          ref: v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
          pip install transformers datasets accelerate pandas pyarrow tqdm safetensors tiktoken sentencepiece

      - name: Generate Dataset
        run: |
          python3 create_dataset.py

      - name: Run Finetuning
        run: |
          python3 finetune_paradox.py

      - name: Archive Checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: adam-finetuned-model
          path: ./adam-finetuned/
